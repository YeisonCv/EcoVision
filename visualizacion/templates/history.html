{% extends 'base.html' %}{% block title %}Historial | EcoVision{% endblock %}{% block content %}
<section class="section-head page-title"><div><p class="eyebrow">PREDICCIONES GUARDADAS</p><h1>Historial</h1><p>Registros persistidos de las imágenes analizadas.</p></div></section><section class="panel"><div class="filters"><label>Categoría<select id="history-category"><option value="">Todas las categorías</option>{% for c in ['battery','biological','brown-glass','cardboard','clothes','green-glass','metal','paper','plastic','shoes','trash','white-glass'] %}<option value="{{c}}">{{c}}</option>{% endfor %}</select></label><label>Desde<input type="date" id="date-from"></label><label>Hasta<input type="date" id="date-to"></label><button class="button button-secondary" id="filter-history">Filtrar</button></div><div class="table-scroll"><table><thead><tr><th>ID</th><th>Archivo</th><th>Categoría</th><th>Confianza</th><th>Fecha y hora (UTC)</th></tr></thead><tbody id="history-rows"></tbody></table></div><p id="history-empty" class="empty hidden">No se encontraron predicciones.</p><div class="pagination"><button id="previous-page" class="button button-secondary">Anterior</button><span id="page-label"></span><button id="next-page" class="button button-secondary">Siguiente</button></div></section>
<script>document.addEventListener('DOMContentLoaded',()=>EcoVision.history())</script>{% endblock %}
