services:
  app:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL en .env con la URL PostgreSQL de Supabase}
      MODEL_DIR: /app/modelo
      MAX_IMAGE_MB: ${MAX_IMAGE_MB:-10}
    ports:
      - "${PORT:-5000}:5000"
    restart: unless-stopped
