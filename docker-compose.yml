services:
  app:
    image: ecovision:portable
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL en .env con la URL PostgreSQL de Supabase}
      SUPABASE_CA_FILE: /run/secrets/supabase-ca.crt
      MODEL_DIR: /app/modelo
      MAX_IMAGE_MB: ${MAX_IMAGE_MB:-10}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      RATE_LIMIT_STORAGE_URI: ${RATE_LIMIT_STORAGE_URI:-memory://}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
    expose:
      - "5000"
    secrets:
      - supabase_ca
    restart: unless-stopped
secrets:
  supabase_ca:
    file: ${SUPABASE_CA_FILE:?Define SUPABASE_CA_FILE como ruta al CA oficial de Supabase}
